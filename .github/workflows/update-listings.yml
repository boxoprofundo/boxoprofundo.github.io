name: Update ticket listings

# Manual-only: prices are fetched live in the browser at search time
# (see providers.js). Run this from the Actions tab if you ever want to
# refresh the shared cached prices in yankees-tickets/data/listings.json.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest prices
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: node scripts/fetch-listings.mjs

      - name: Commit updated listings
        run: |
          if [ ! -f yankees-tickets/data/listings.json ]; then
            echo "No listings file produced (API secrets not configured); nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yankees-tickets/data/listings.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ticket listings"
            git push
          fi
